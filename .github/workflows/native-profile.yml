name: Native profile VM

on:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/native-profile.yml'
      - '.editorconfig'
      - 'global.json'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'nuget.config'
      - 'contracts/**'
      - 'docs/proposals/*native*'
      - 'docs/proposals/SMARTACCOUNT-NATIVE*'
      - 'docs/reports/aa-native-ci-probe-consistency-20261009.json'
      - 'scripts/*native*'
      - 'scripts/verify_repo*'
      - 'scripts/check_neo_platform_packages*'
      - 'scripts/dotnet_env.sh'
      - 'tests/NativeMultiSigProbe/**'
      - 'tests/NativeEpochProbe/**'
      - 'tests/AbstractAccount.Contracts.Tests/RuntimeTestSupport.cs'
  pull_request:
    paths:
      - '.github/workflows/native-profile.yml'
      - '.editorconfig'
      - 'global.json'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'nuget.config'
      - 'contracts/**'
      - 'docs/proposals/*native*'
      - 'docs/proposals/SMARTACCOUNT-NATIVE*'
      - 'docs/reports/aa-native-ci-probe-consistency-20261009.json'
      - 'scripts/*native*'
      - 'scripts/verify_repo*'
      - 'scripts/check_neo_platform_packages*'
      - 'scripts/dotnet_env.sh'
      - 'tests/NativeMultiSigProbe/**'
      - 'tests/NativeEpochProbe/**'
      - 'tests/AbstractAccount.Contracts.Tests/RuntimeTestSupport.cs'
  workflow_dispatch:

# PR code only receives read access. This job never publishes, uses deployment
# secrets, or runs pull_request_target code with a privileged token.
permissions:
  contents: read

concurrency:
  group: native-profile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-vm:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: aa
        shell: bash
    env:
      # Updated only after the matching core changes have a reviewed immutable SHA.
      NATIVE_CORE_COMMIT: ff422d940a4722c361c32398c6f28c00fb7f0693
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Check out account sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: aa
          persist-credentials: false
      - name: Check out reviewed native core
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: neo-project/neo
          ref: ${{ env.NATIVE_CORE_COMMIT }}
          path: native-core
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.400
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
      - name: Select the exact SDK and configure isolated paths
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import sys
          sys.path.insert(0, 'scripts')
          from native_profile_ci import pin_sdk
          pin_sdk(Path(os.environ['GITHUB_WORKSPACE']))
          PY
          test "$(dotnet --version)" = '10.0.400'
          printf 'NUGET_PACKAGES=%s\n' "$RUNNER_TEMP/native-profile-packages" >> "$GITHUB_ENV"
          printf 'NCCS_BIN=%s\n' "$RUNNER_TEMP/native-profile-tools/nccs" >> "$GITHUB_ENV"
      - name: Check profile, metadata and evidence guards
        run: |
          python3 docs/proposals/validate-native-smartaccount-profile.py
          python3 -m unittest discover -s docs/proposals -p test_native_profile_v2.py -v
          python3 -m unittest discover -s scripts -p test_native_profile_ci.py -v
          python3 -m unittest discover -s scripts -p test_native_module_profile.py -v
          python3 -m unittest discover -s scripts -p test_build_native_modules.py -v
      - name: Restore audited packages and compiler
        run: |
          node scripts/check_neo_platform_packages.mjs --include-native
          dotnet tool install neo.compiler.csharp --version 3.9.1 --tool-path "$RUNNER_TEMP/native-profile-tools" --configfile nuget.config
          node scripts/check_neo_platform_packages.mjs --compiler-only
      - name: Verify native module isolation
        env:
          NEOOS_NATIVE_EPOCH_RECEIPT: ${{ runner.temp }}/native-profile-receipts/native-epoch.json
        run: ./scripts/verify_repo.sh --profile native --contracts-only
      - name: Build pinned core and two module copies, then execute native VM matrix
        run: |
          python3 scripts/native_profile_ci.py \
            --core "$GITHUB_WORKSPACE/native-core" \
            --core-commit "$NATIVE_CORE_COMMIT" \
            --compiler "$NCCS_BIN" \
            --cache "$NUGET_PACKAGES" \
            --work "$RUNNER_TEMP/native-profile-work" \
            --output "$RUNNER_TEMP/native-profile-receipts"
      # The epoch fixture and pinned native core VM are distinct checks; neither
      # substitutes for the separate full-chain acceptance runner.
      - name: Retain minimal build and VM receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-profile-receipts
          path: |
            ${{ runner.temp }}/native-profile-receipts/native-profile-ci.json
            ${{ runner.temp }}/native-profile-receipts/native-epoch.json
            ${{ runner.temp }}/native-profile-receipts/core-build-manifest.json
            ${{ runner.temp }}/native-profile-receipts/module-build.json
            ${{ runner.temp }}/native-profile-receipts/multisig-probe.json
          if-no-files-found: warn
          retention-days: 14
