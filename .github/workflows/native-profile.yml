name: Native profile VM

on:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/native-profile.yml'
      - '.editorconfig'
      - 'global.json'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'nuget.config'
      - 'contracts/**'
      - 'contracts/native/**'
      - 'tests/SmartAccount.Native.Tests/**'
      - 'docs/SA-MODULE-PROTOCOL*.md'
      - 'docs/proposals/smartaccount-native-profile-parameters.json'
      - 'docs/proposals/validate-native-smartaccount-profile.py'
      - 'docs/proposals/SMARTACCOUNT-NATIVE*'
      - 'docs/reports/sa-native-ci-probe-consistency-20261009.json'
      - 'scripts/*native*'
      - 'scripts/verify_repo*'
      - 'scripts/check_neo_platform_packages*'
      - 'scripts/dotnet_env.sh'
      - 'shared/native*.mjs'
      - 'frontend/src/features/native/**'
      - 'frontend/src/shared/native*.mjs'
      - 'frontend/tests/native*'
      - 'frontend/tests/fixtures/native*'
      - 'sdk/js/src/native/**'
      - 'sdk/js/src/native*'
      - 'sdk/js/tests/native*'
      - 'sdk/js/tests/fixtures/native-*'
      - 'tests/NativeMultiSigProbe/**'
      - 'tests/NativeEpochProbe/**'
      - 'tests/SmartAccount.Contracts.Tests/RuntimeTestSupport.cs'
  pull_request:
    paths:
      - '.github/workflows/native-profile.yml'
      - '.editorconfig'
      - 'global.json'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'nuget.config'
      - 'contracts/**'
      - 'contracts/native/**'
      - 'tests/SmartAccount.Native.Tests/**'
      - 'docs/SA-MODULE-PROTOCOL*.md'
      - 'docs/proposals/smartaccount-native-profile-parameters.json'
      - 'docs/proposals/validate-native-smartaccount-profile.py'
      - 'docs/proposals/SMARTACCOUNT-NATIVE*'
      - 'docs/reports/sa-native-ci-probe-consistency-20261009.json'
      - 'scripts/*native*'
      - 'scripts/verify_repo*'
      - 'scripts/check_neo_platform_packages*'
      - 'scripts/dotnet_env.sh'
      - 'shared/native*.mjs'
      - 'frontend/src/features/native/**'
      - 'frontend/src/shared/native*.mjs'
      - 'frontend/tests/native*'
      - 'frontend/tests/fixtures/native*'
      - 'sdk/js/src/native/**'
      - 'sdk/js/src/native*'
      - 'sdk/js/tests/native*'
      - 'sdk/js/tests/fixtures/native-*'
      - 'tests/NativeMultiSigProbe/**'
      - 'tests/NativeEpochProbe/**'
      - 'tests/SmartAccount.Contracts.Tests/RuntimeTestSupport.cs'
  workflow_dispatch:

# PR code only receives read access. This job never publishes, uses deployment
# secrets, or runs pull_request_target code with a privileged token.
permissions:
  contents: read

concurrency:
  group: native-profile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-vm:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: sa
        shell: bash
    env:
      # Updated only after the matching core changes have a reviewed immutable SHA.
      NATIVE_CORE_COMMIT: e7fcc132f6546c55ad7342f26d69081a71357be5
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Check out account sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: sa
          persist-credentials: false
      - name: Check out reviewed native core
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: neo-project/neo
          ref: ${{ env.NATIVE_CORE_COMMIT }}
          path: native-core
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.400
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
      - name: Select the exact SDK and configure isolated paths
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import sys
          sys.path.insert(0, 'scripts')
          from native_profile_ci import pin_sdk
          pin_sdk(Path(os.environ['GITHUB_WORKSPACE']))
          PY
          test "$(dotnet --version)" = '10.0.400'
          printf 'NUGET_PACKAGES=%s\n' "$RUNNER_TEMP/native-profile-packages" >> "$GITHUB_ENV"
          printf 'NCCS_BIN=%s\n' "$RUNNER_TEMP/native-profile-tools/nccs" >> "$GITHUB_ENV"
      - name: Gate the core SmartAccount copies on the true source
        # contracts/native/SmartAccount/ is the only editable copy;
        # the pinned core must carry exactly its regenerated copies or the lane
        # fails here, before any build or test work is spent.
        run: |
          python3 scripts/sync_native_smartaccount.py --check --core "$GITHUB_WORKSPACE/native-core"
      - name: Check profile, metadata and evidence guards
        run: |
          python3 docs/proposals/validate-native-smartaccount-profile.py
          # The selected profile's complete unittest matrix runs once through
          # verify_repo.sh below; keep this step as the cheap fail-fast ABI guard.
      - name: Restore audited packages and compiler
        run: |
          # Native is the default package scope: six modules, the epoch probe and its fixture,
          # and the two source-runtime probe hosts. No custom project is restored.
          node scripts/check_neo_platform_packages.mjs
          dotnet tool install neo.compiler.csharp --version 3.9.1 --tool-path "$RUNNER_TEMP/native-profile-tools" --configfile nuget.config
          node scripts/check_neo_platform_packages.mjs --compiler-only
      - name: Verify native module isolation
        env:
          NEOOS_NATIVE_TEST_RESULTS: ${{ runner.temp }}/native-profile-receipts
          NEOOS_NATIVE_EPOCH_RECEIPT: ${{ runner.temp }}/native-profile-receipts/native-epoch.json
          # SmartAccount.sln is native-only and builds against this checkout, so point the
          # solution build and native unit-test gate at it instead of the default sibling.
          NEOOS_NATIVE_CORE_SOURCE: ${{ github.workspace }}/native-core
        run: ./scripts/verify_repo.sh --profile native --contracts-only
      - name: Rebuild current native module packages twice
        run: |
          python3 scripts/build_native_modules.py \
            --contracts "$PWD/contracts" --compiler "$NCCS_BIN" --cache "$NUGET_PACKAGES" \
            --output "$RUNNER_TEMP/native-module-artifacts" \
            --receipt "$RUNNER_TEMP/native-profile-receipts/module-build.json"
      - name: Verify packaged native modules against their named NEPs in NeoVM
        run: python3 scripts/check_module_neps.py --native-packages "$RUNNER_TEMP/native-module-artifacts"
      - name: Retain minimal build and VM receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-profile-receipts
          path: |
            ${{ runner.temp }}/native-profile-receipts/native-epoch.json
            ${{ runner.temp }}/native-profile-receipts/native.trx
            ${{ runner.temp }}/native-profile-receipts/module-build.json
          if-no-files-found: warn
          retention-days: 14
