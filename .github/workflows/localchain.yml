name: AA local-chain acceptance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deployed-artifact-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
      - name: Install published neoxp
        run: |
          dotnet tool install Neo.Express --version 3.10.1 --tool-path "$RUNNER_TEMP/aa-neoxp"
          echo "$RUNNER_TEMP/aa-neoxp" >> "$GITHUB_PATH"
      - name: Install relay dependencies
        run: |
          npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
          npm ci --prefix sdk/js --ignore-scripts --no-audit --no-fund
      - name: Report prerequisites
        run: |
          neoxp --version
          python3 --version
          node --version
          openssl version
      - name: Test receipt gate
        run: python3 tests/localchain/test_gate.py
      - name: Run deployed artifact suite
        run: python3 tests/localchain/run.py
      - name: Test planted verifier mismatch
        run: python3 tests/localchain/test_mismatch.py
      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aa-localchain-receipt
          path: tests/localchain/out/rpc-deployed.json
          if-no-files-found: error
