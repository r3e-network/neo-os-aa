name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

# This workflow reads the checkout and publishes nothing. Without an explicit
# block the job would receive the repository default, which can be the legacy
# read/write GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            sdk/js/package-lock.json
      # Needs no packages, so it still runs when the gate below fails.
      - name: Repository hygiene and package-pin tests
        run: node --test scripts/repo_hygiene.test.mjs scripts/check_neo_platform_packages.test.mjs scripts/fuzz_continuous.test.mjs
      # Neo.SmartContract.Framework and Neo.SmartContract.Testing 3.10.1, the Neo packages they pull
      # in and every other NuGet package are published on nuget.org, which nuget.config makes the
      # only source. Directory.Build.props pins the framework and the packages.lock.json next to
      # each project pins the rest; restore runs in locked mode, so a changed resolution or different
      # package bytes fail here, within seconds, with the pinned versions named
      # (docs/AA-REPRODUCIBLE-BUILD.md), instead of deep inside verify_repo.sh.
      - name: Check pinned Neo platform packages (framework 3.10.1)
        run: node scripts/check_neo_platform_packages.mjs
      # The compiler is not a project dependency, so no lock file covers it. verify_repo.sh and
      # contracts/compile.sh check that the installed nccs is this exact package.
      - name: Install Neo compiler (nccs 3.9.1)
        run: dotnet tool install -g neo.compiler.csharp --version 3.9.1
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install SDK dependencies
        working-directory: sdk/js
        run: npm ci
      - name: Install Playwright browser for frontend e2e
        working-directory: frontend
        run: npm run test:e2e:install
      - name: Verify repository
        run: ./scripts/verify_repo.sh
