name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

# This workflow reads the checkout and publishes nothing. Without an explicit
# block the job would receive the repository default, which can be the legacy
# read/write GITHUB_TOKEN.
permissions:
  contents: read

env:
  # The reviewed core the native solution builds against; native-profile.yml pins the same SHA.
  NATIVE_CORE_COMMIT: e7fcc132f6546c55ad7342f26d69081a71357be5

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      # SmartAccount.sln is native-only, so the acceptance build and test gate needs the pinned
      # core sources it compiles. Without this checkout verify_repo.sh reports the native build
      # gate NOT RUN instead of silently passing it.
      - name: Check out reviewed native core
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: neo-project/neo
          ref: ${{ env.NATIVE_CORE_COMMIT }}
          path: native-core
          # Full history: scripts/native_core_pin.py diffs this checkout against upstream Neo
          # commit 99618f48, which a shallow clone does not contain.
          fetch-depth: 0
          persist-credentials: false
      # Source-only architecture gates, before any toolchain or restore work: the 26-method ABI
      # IDL, native purity (contracts/native/SmartAccount carries no SDK-style logic) and the
      # core-tree pin (the checked-out core differs from upstream Neo only inside the reviewed
      # allowlist). verify_repo.sh runs the same gates inside the acceptance entrypoint.
      - name: Architecture gates (ABI IDL, native purity, core-tree pin)
        run: |
          python3 scripts/check_smartaccount_v41_idl.py
          python3 scripts/native_purity.py
          python3 scripts/native_core_pin.py --core "$GITHUB_WORKSPACE/native-core"
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            sdk/js/package-lock.json
      # Needs no packages, so it still runs when the gate below fails.
      - name: Repository hygiene and package-pin tests
        run: node --test scripts/repo_hygiene.test.mjs scripts/check_neo_platform_packages.test.mjs scripts/source_map_js_pin.test.mjs scripts/verify_repo.test.mjs
      # Neo.SmartContract.Framework and Neo.SmartContract.Testing 3.10.1, the Neo packages they pull
      # in and every other NuGet package are published on nuget.org, which nuget.config makes the
      # only source. Directory.Build.props pins the framework and the packages.lock.json next to
      # each project pins the rest; restore runs in locked mode, so a changed resolution or different
      # package bytes fail here, within seconds, with the pinned versions named
      # (docs/engineering/VERIFICATION-AND-GATES.md, the SA reproducible-build chapter), instead of deep inside verify_repo.sh.
      - name: Check pinned Neo platform packages (framework 3.10.1)
        run: node scripts/check_neo_platform_packages.mjs
      # The compiler is not a project dependency, so no lock file covers it. verify_repo.sh
      # checks that the installed nccs is this exact package before the first build.
      - name: Install Neo compiler (nccs 3.9.1)
        run: dotnet tool install -g neo.compiler.csharp --version 3.9.1
      - name: Verify subscription module behavior in NeoVM
        run: |
          export SMARTACCOUNT_ARTIFACT_DIR="$(mktemp -d)"
          compiler="$HOME/.dotnet/tools/nccs"
          "$compiler" tests/mocks/MockVerifierCore.csproj -o "$SMARTACCOUNT_ARTIFACT_DIR"
          "$compiler" tests/mocks/MockTransferTarget.csproj -o "$SMARTACCOUNT_ARTIFACT_DIR"
          "$compiler" contracts/plugins/validators/SubscriptionValidator.csproj -o "$SMARTACCOUNT_ARTIFACT_DIR/validators"
          dotnet test tests/SmartAccount.Contracts.Tests --filter 'FullyQualifiedName~SubscriptionValidatorRuntimeTests|Name~NewScheduleWaitsForBothBookedWindows|Name~SubscriptionConfigurationRequiresIntegerFields|Name~SubscriptionIdsUseTheirFullBytes|Name~CancelKeepsTheLastChargedPeriodTombstone|Name~RenewedSubscriptionUsesCurrentDescriptorGeneration'
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install SDK dependencies
        working-directory: sdk/js
        run: npm ci
      - name: Install Playwright browser for frontend e2e
        working-directory: frontend
        run: npm run test:e2e:install
      # Uses local RPC/wallet fixtures and the dependencies installed above.
      # This workflow has no path filter: UI, shared, SDK and test changes all run it.
      - name: Verify native account browser fixtures
        working-directory: frontend
        run: npm run test:native:browser
      # The native profile is the only acceptance path: the package/profile guards, the
      # native-only solution build, the native unit tests and the module epoch VM fixture.
      # The custom user-contract tree was deleted (Task #43), so no job here reads it.
      - name: Verify native contracts and clients
        env:
          NEOOS_NATIVE_CORE_SOURCE: ${{ github.workspace }}/native-core
        run: ./scripts/verify_repo.sh --profile native
